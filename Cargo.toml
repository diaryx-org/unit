# unit — a component library for Dioxus that draws the same on the web and
# on dioxus-native (Blitz), on a desktop and on a phone, and is read by
# assistive tech on each: no JavaScript, no DOM focus moved from code, every
# overlay mounted from the first frame. See src/lib.rs for why each of those.
#
# The library at the root, and `gallery/`, every component on one page, which
# runs on Blitz, on the web, and headless under test. It began in leaf's
# crates/unit.
#
#     cargo test                                  # the library
#     cargo test -p unit-gallery                  # every component, laid out by Blitz
#     cargo run -p unit-gallery                   # the gallery, in a window
[workspace]
members = ["gallery"]
default-members = [".", "gallery"]

[package]
name = "unit"
version = "0.0.0"
edition = "2024"
description = "Components for Dioxus that work the same on the web and on dioxus-native, with accessibility on both."
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/unit"
publish = false

[dependencies]
# Only Dioxus itself: no renderer, so a web page and a Blitz window use the
# crate as it is, and it builds in seconds.
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.3"

# Blitz from diaryx-org's fork, its `leaf` branch, at the version
# dioxus-native pins (FORK.md there): its accessibility tree reads ARIA's
# roles and states, a removed node is forgotten by its layout parent, a
# press focuses what it lands on, and assistive tech's click is carried out.
# Every Blitz crate in the graph comes from it, as the fork's crates depend
# on each other by path. Only the gallery reaches Blitz; the library does
# not.
[patch.crates-io]
blitz-dom = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-traits = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-shell = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-paint = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-net = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
stylo_taffy = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
debug_timer = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
accesskit_xplat = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
# Blitz's default renderer, vello-hybrid, which the gallery draws with: the
# fork's patches make it draw emoji, backdrop-filter, color matrices and a
# blur with one after it (FORK.md there).
anyrender_vello_hybrid = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
glifo = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
vello_gpu = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
vello_gpu_shaders = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }

[profile.dev]
debug = "line-tables-only"

# Stylo, parley and Vello optimised even in a debug build, or a frame takes
# ten times as long to draw.
[profile.dev.package."*"]
opt-level = 3
