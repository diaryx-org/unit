# corgi: one build store for the machine, shared by every checkout
# (https://corgi.build). Cargo reads none of this; it is corgi's alone.
#
# The libraries and the Python are diaryx's corgi.toml's, to the hash, so what
# unit and diaryx share (Blitz, Stylo, fontconfig) is built once for both.
# CI builds with cargo, and so does a machine without corgi.

# The glibc a Linux build links against, as diaryx's.
glibc = "2.38"

# Files a package reads beyond the `.rs` files in its own directory, relative
# to the package. A test's file missing here is a cached pass that outlives an
# edit to it.
[extra-inputs]
# The audit: its list of failures, and the page and the components it compares.
unit-gallery = ["audit.baseline", "src/lib.rs", "../src/components/*.rs"]

# fontconfig and what it is linked with (Blitz's text, through
# yeslogic-fontconfig-sys), and OpenSSL (dioxus-native's `net`).
[libraries.libfontconfig-dev]
